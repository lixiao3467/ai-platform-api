[project]
name = "ai-platform"
version = "0.1.0"
description = "Enterprise AI Middle Platform — Unified AI capabilities for enterprise applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AI Platform Team" }]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # Cache & Queue
    "redis>=5.1.0",
    # LLM Providers
    "litellm>=1.50.0",
    "openai>=1.51.0",
    "anthropic>=0.37.0",
    "dashscope>=1.20.0",
    # HTTP Client
    "httpx>=0.27.0",
    # AI Frameworks
    "langgraph>=0.2.0",
    "llama-index>=0.11.0",
    "llama-index-vector-stores-milvus>=0.3.0",
    # Vector DB
    "pymilvus>=2.4.0",
    # Document Processing
    "pymupdf4llm>=0.0.12",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    # Template Engine
    "jinja2>=3.1.0",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",
    # Observability
    "structlog>=24.4.0",
    "langfuse>=2.0.0",
    # Utilities
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    # Config Center
    "nacos-sdk-python>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
ai-platform = "ai_platform.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ai_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
